name: Automated Quality & Scoring Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-scoring-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Telex NFC, Weighted Score, XSS & CSV Security Tests
        run: node tests/test_scoring_and_telex.mjs

  <text x="50" y="65" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="900">KIỂM THỬ THÔNG MẠNG 100% 0% PACKET LOSS &amp; IN TEST PAGE THÀNH CÔNG</text>

  <!-- Left: Command Prompt CMD Window -->

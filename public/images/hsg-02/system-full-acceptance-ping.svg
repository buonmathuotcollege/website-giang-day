      <text y="0">Microsoft Windows [Version 10.0.19045.3803]</text>
      <text y="18">(c) Microsoft Corporation. All rights reserved.</text>
      
      <text y="50" fill="#ffffff">C:UsersKySuTruong> ping 192.168.10.1 -t</text>
      

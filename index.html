<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Cổng Kỹ Năng Mạng Máy Tính</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    :root {
      --theme-color: #2563eb;
      --text-color: #1e293b;
      --bg-color: #f8fafc;
    }
    body {
      font-family: 'Be Vietnam Pro', -apple-system, sans-serif !important;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 15px;
      line-height: 1.7;
    }
    
    /* === LÀM ĐẸP THANH MENU BÊN TRÁI === */
    .sidebar {
      width: 290px !important;
      background-color: #ffffff !important;
      border-right: 1px solid #e2e8f0;
      padding-top: 15px;
    }
    .content {
      left: 290px !important;
    }
    .sidebar .app-name-link {
      font-weight: 700;
      font-size: 1.1rem;
      color: #0f172a !important;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /* Tiêu đề nhóm in hoa, chữ nhỏ, màu nhạt sang trọng */
    .sidebar p, .sidebar strong {
      font-size: 0.72rem !important;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8 !important;
      font-weight: 700 !important;
      margin: 18px 16px 6px 16px !important;
      display: block;
    }
    /* Các mục bài học: cho phép xuống hàng mềm mại, không bao giờ bị cắt ba chấm */
    .sidebar ul li a {
      border-radius: 6px !important;
      margin: 2px 10px !important;
      padding: 7px 12px !important;
      font-size: 0.88rem !important;
      color: #475569 !important;
      font-weight: 500 !important;
      white-space: normal !important; /* Không cắt cụt chữ */
      line-height: 1.4 !important;
      border-left: 3px solid transparent;
      transition: all 0.15s ease;
    }
    .sidebar ul li a:hover {
      background-color: #f1f5f9 !important;
      color: #2563eb !important;
    }
    /* Mục đang chọn: Tinh tế với nền xanh nhạt + viền xanh mảnh bên trái */
    .sidebar ul li.active > a {
      background-color: #eff6ff !important;
      color: #1d4ed8 !important;
      font-weight: 600 !important;
      border-left: 3px solid #2563eb !important;
      border-radius: 0 6px 6px 0 !important;
    }

    /* Thẻ Card bên phải */
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin: 20px 0;
    }
    .card-item {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 18px -3px rgba(37, 99, 235, 0.12);
      border-color: #93c5fd;
    }
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 600;
      background: #dbeafe;
      color: #1d4ed8;
      width: fit-content;
      margin-bottom: 8px;
    }
    
    /* Trang bìa */
    section.cover {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #0284c7 100%) !important;
    }
    section.cover .cover-main { color: #ffffff !important; }
    section.cover p { color: #e0f2fe !important; }
  </style>
</head>
<body>
  <div id="app">Đang tải...</div>
  <script>
    window.$docsify = {
      name: '🌐 KỸ NĂNG MẠNG',
      loadSidebar: true,
      subMaxLevel: 2,
      coverpage: true,
      auto2top: true,
      search: {
        placeholder: '🔍 Tìm nhanh kỹ năng...',
        noData: 'Không có kết quả'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
</body>
</html>

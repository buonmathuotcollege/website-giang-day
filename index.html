<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Cổng Học Tập & Bài Giảng Trực Tuyến</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Font chữ tiếng Việt hiện đại & Theme tinh tế -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --base-font-family: 'Be Vietnam Pro', sans-serif;
      --theme-color: #0284c7; /* Xanh dương giáo dục hiện đại */
      --sidebar-width: 280px;
      --content-max-width: 900px;
    }
    .cover-main h1 { font-weight: 700; color: #0f172a; }
    .cover-main p { font-size: 1.15rem; color: #475569; }
  </style>
</head>
<body>
  <div id="app">Đang tải học liệu...</div>
  <script>
    window.$docsify = {
      name: '📚 Cổng Học Tập',
      loadSidebar: true,
      subMaxLevel: 2,
      coverpage: true,       /* Bật trang bìa chào mừng */
      search: {
        placeholder: 'Tìm kiếm bài giảng, tài liệu...',
        noData: 'Không tìm thấy kết quả!'
      },
      copyCode: {
        buttonText: 'Sao chép',
        successText: 'Đã chép'
      }
    }
  </script>
  <!-- Các thư viện bổ trợ hiển thị -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
</body>
</html>

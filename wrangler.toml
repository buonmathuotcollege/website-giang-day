name = "website-giang-day"
main = "dist/_worker.js/index.js"
compatibility_date = "2026-11-04"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[assets]
directory = "dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "giang-day-db"
database_id = "giang-day-db"
